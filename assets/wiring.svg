<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" style="background:#f8fbff;font-family:'Microsoft YaHei',Segoe UI,sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 L2.5,4.5 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ================= 标题 ================= -->
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Quectel Pi M2 — 超声波距离感知 Demo 接线图</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#475569">降压稳压模块统一供电：5V 固定输出 → 主控板 / 超声波模块 / 电平转换 B 侧；可调输出 → 舵机；所有地汇到稳压模块 GND 端</text>

  <!-- ================= 输入电源 ================= -->
  <g filter="url(#shadow)">
    <rect x="40" y="86" width="170" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  </g>
  <text x="125" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">7.4V 锂电池（2S）</text>
  <text x="125" y="128" text-anchor="middle" font-size="10" fill="#4338ca">接稳压模块的输入端</text>
  <line x1="214" y1="114" x2="290" y2="114" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="106" text-anchor="middle" font-size="9" fill="#475569">7.4V 输入</text>

  <!-- ================= 降压稳压模块 ================= -->
  <g filter="url(#shadow)">
    <rect x="298" y="78" width="304" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="450" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">降压稳压模块</text>
  <text x="450" y="122" text-anchor="middle" font-size="10" fill="#92400e">多路独立输出 · 5V 固定 / 可调 / GND</text>
  <text x="312" y="150" text-anchor="middle" font-size="9" fill="#475569">GND</text>
  <text x="450" y="150" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">5V</text>
  <text x="596" y="140" text-anchor="end" font-size="9" font-weight="700" fill="#c2410c">可调</text>

  <!-- ============ 5V 电源母线（红）：一个 5V 输出带三处负载 ============ -->
  <path d="M450,158 L450,205 M90,205 L820,205 M150,205 L150,280 M470,205 L470,280 M765,205 L765,280"
        stroke="#dc2626" stroke-width="3" fill="none"/>
  <circle cx="450" cy="205" r="4" fill="#dc2626"/>
  <circle cx="150" cy="205" r="4" fill="#dc2626"/>
  <circle cx="470" cy="205" r="4" fill="#dc2626"/>
  <circle cx="765" cy="205" r="4" fill="#dc2626"/>
  <text x="300" y="197" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">5V 电源母线（稳压模块 5V 固定输出）</text>
  <text x="150" y="248" text-anchor="middle" font-size="9" fill="#b91c1c">5V → Pin2</text>
  <text x="470" y="248" text-anchor="middle" font-size="9" fill="#b91c1c">5V → VCCB</text>
  <text x="765" y="248" text-anchor="middle" font-size="9" fill="#b91c1c">5V → VCC</text>
  <text x="322" y="245" text-anchor="start" font-size="9" font-weight="700" fill="#475569">GND → 公共地母线</text>

  <!-- ============ 可调输出（橙）：只给舵机 ============ -->
  <path d="M602,120 L965,120 L965,725 L884,725" stroke="#ea580c" stroke-width="3" fill="none"/>
  <text x="712" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c">可调输出 5.0~5.5V → 舵机（独立一路）</text>

  <!-- ============ GND 公共地（灰）：所有地汇到稳压模块 GND 端 ============ -->
  <path d="M310,158 L310,199 Q318,205 310,211 L310,250 L40,250 L40,620 L830,620"
        stroke="#64748b" stroke-width="3" fill="none"/>
  <path d="M200,560 L200,620 M520,560 L520,620 M720,560 L720,620 M765,620 L765,670"
        stroke="#64748b" stroke-width="3" fill="none"/>
  <circle cx="200" cy="620" r="4" fill="#64748b"/>
  <circle cx="310" cy="620" r="4" fill="#64748b"/>
  <circle cx="520" cy="620" r="4" fill="#64748b"/>
  <circle cx="720" cy="620" r="4" fill="#64748b"/>
  <circle cx="765" cy="620" r="4" fill="#64748b"/>
  <text x="485" y="612" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">GND 公共地母线 —— 所有地都汇到稳压模块 GND 端</text>

  <!-- ================= 主控板 ================= -->
  <g filter="url(#shadow)">
    <rect x="60" y="280" width="230" height="280" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  </g>
  <text x="175" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">Quectel Pi M2</text>
  <text x="175" y="324" text-anchor="middle" font-size="10" fill="#0ea5e9">40-Pin 扩展口</text>
  <text x="80" y="360" font-size="11" font-weight="700" fill="#b91c1c">Pin2</text><text x="200" y="360" font-size="10" fill="#475569">5V  ← 5V 母线</text>
  <text x="80" y="386" font-size="11" font-weight="700" fill="#2563eb">Pin1</text><text x="200" y="386" font-size="10" fill="#475569">3.3V → 电平 VCCA</text>
  <text x="80" y="412" font-size="11" font-weight="700" fill="#334155">Pin9</text><text x="200" y="412" font-size="10" fill="#475569">GND → 电平 GND</text>
  <text x="80" y="438" font-size="11" font-weight="700" fill="#334155">Pin14</text><text x="200" y="438" font-size="10" fill="#475569">GND → GND 母线</text>
  <text x="80" y="464" font-size="11" font-weight="700" fill="#0f172a">Pin27</text><text x="200" y="464" font-size="10" fill="#475569">I2C7_SDA → A1</text>
  <text x="80" y="490" font-size="11" font-weight="700" fill="#0f172a">Pin28</text><text x="200" y="490" font-size="10" fill="#475569">I2C7_SCL → A2</text>
  <text x="80" y="516" font-size="11" font-weight="700" fill="#7c3aed">Pin33</text><text x="200" y="516" font-size="10" fill="#475569">PWM → 舵机 SIG</text>

  <!-- ================= 电平转换 ================= -->
  <g filter="url(#shadow)">
    <rect x="350" y="280" width="240" height="280" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  </g>
  <text x="470" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">8 路双向电平转换</text>
  <text x="470" y="324" text-anchor="middle" font-size="10" fill="#22c55e">TXS0108 系列</text>
  <text x="365" y="360" font-size="11" font-weight="700" fill="#991b1b">VCCB</text><text x="575" y="360" text-anchor="end" font-size="10" fill="#475569">5V ← 5V 母线</text>
  <text x="365" y="386" font-size="11" font-weight="700" fill="#1e40af">VCCA</text><text x="575" y="386" text-anchor="end" font-size="10" fill="#475569">3.3V ← Pin1</text>
  <text x="365" y="412" font-size="11" font-weight="700" fill="#334155">GND</text><text x="575" y="412" text-anchor="end" font-size="10" fill="#475569">← Pin9</text>
  <text x="365" y="464" font-size="11" font-weight="700" fill="#1e40af">A1 / SDA</text><text x="575" y="464" text-anchor="end" font-size="10" fill="#475569">← Pin27</text>
  <text x="365" y="490" font-size="11" font-weight="700" fill="#1e40af">A2 / SCL</text><text x="575" y="490" text-anchor="end" font-size="10" fill="#475569">← Pin28</text>
  <text x="365" y="516" font-size="11" font-weight="700" fill="#991b1b">B1 / SDA</text><text x="575" y="516" text-anchor="end" font-size="10" fill="#475569">→ 模块 SDA</text>
  <text x="365" y="542" font-size="11" font-weight="700" fill="#991b1b">B2 / SCL</text><text x="575" y="542" text-anchor="end" font-size="10" fill="#475569">→ 模块 SCL</text>

  <!-- ================= 超声波模块 ================= -->
  <g filter="url(#shadow)">
    <rect x="650" y="280" width="230" height="280" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  </g>
  <text x="765" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">幻彩超声波模块</text>
  <text x="765" y="324" text-anchor="middle" font-size="10" fill="#fb923c">STC8H1K08 + RCWL-9616</text>
  <text x="665" y="360" font-size="11" font-weight="700" fill="#c2410c">VCC</text><text x="865" y="360" text-anchor="end" font-size="10" fill="#475569">5V ← 5V 母线</text>
  <text x="665" y="386" font-size="11" font-weight="700" fill="#334155">GND</text><text x="865" y="386" text-anchor="end" font-size="10" fill="#475569">→ GND 母线</text>
  <text x="665" y="424" font-size="10" fill="#92400e">模式焊点须为 IIC</text>
  <text x="665" y="450" font-size="10" fill="#92400e">I2C 地址 0x2D</text>
  <text x="665" y="516" font-size="11" font-weight="700" fill="#991b1b">SDA</text><text x="865" y="516" text-anchor="end" font-size="10" fill="#475569">← B1</text>
  <text x="665" y="542" font-size="11" font-weight="700" fill="#991b1b">SCL</text><text x="865" y="542" text-anchor="end" font-size="10" fill="#475569">← B2</text>

  <!-- ================= 舵机 ================= -->
  <g filter="url(#shadow)">
    <rect x="650" y="670" width="230" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text x="765" y="696" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">SG90 / MG90S 舵机</text>
  <text x="665" y="722" font-size="10" fill="#c2410c">VCC 红 ← 可调输出 5.0~5.5V</text>
  <text x="665" y="746" font-size="10" fill="#475569">GND 棕 → GND 母线</text>
  <text x="665" y="770" font-size="10" fill="#7c3aed">SIG 橙 ← Pin33（PWM）</text>

  <!-- ================= 信号线 ================= -->
  <path d="M290,386 L350,386" stroke="#1e40af" stroke-width="2" fill="none"/>
  <path d="M290,412 L350,412" stroke="#334155" stroke-width="2" fill="none"/>
  <path d="M290,464 L350,464" stroke="#0f172a" stroke-width="2" fill="none"/>
  <path d="M290,490 L350,490" stroke="#0f172a" stroke-width="2" fill="none"/>
  <path d="M590,516 L650,516" stroke="#0f172a" stroke-width="2" fill="none"/>
  <path d="M590,542 L650,542" stroke="#0f172a" stroke-width="2" fill="none"/>
  <path d="M60,516 L30,516 L30,725 L650,725" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6,3"/>
  <text x="42" y="600" font-size="9" fill="#7c3aed" transform="rotate(-90 42,600)">Pin33 PWM</text>

  <!-- ================= 图例与要点 ================= -->
  <rect x="40" y="800" width="920" height="86" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="56" y="822" font-size="11" font-weight="700" fill="#0f172a">线色与图例</text>
  <text x="56" y="841" font-size="10" fill="#475569">红 = 5V（稳压模块 5V 固定输出，同时带主控板 / 超声波模块 / 电平转换 B 侧）　橙 = 可调输出（只给舵机）　灰 = 地（所有地汇到稳压模块 GND 端）　深色 = I2C 与 PWM 信号</text>
  <text x="56" y="858" font-size="10" fill="#475569">线条交叉处无圆点表示「不相连」，有实心圆点表示「相连」。三处电源的地最终都回到稳压模块 GND 端，属于同一个地网络。</text>
  <text x="56" y="875" font-size="10" fill="#b91c1c">务必核对：VCCA 接 3.3V（M2 Pin1）、VCCB 接 5V（稳压模块 5V 输出）；模块模式焊点拨到 IIC；40-Pin 供电时不要再插 USB-C 电源。</text>
</svg>
